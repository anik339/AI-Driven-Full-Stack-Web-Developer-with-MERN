<!DOCTYPE html>

<html lang="en">


<head>

    <meta charset="UTF-8">

    <title>HTML Attributes Example</title>

</head>


<body>


<h1 id="main-title" class="heading" title="This is a heading">

    HTML Attributes

</h1>



<p id="para1" class="text" style="color:blue;" title="Paragraph information">

    This is a paragraph with global attributes.

</p>



<img 
src="img_girl.jpg"
alt="Girl Image"
width="300"
height="400"
title="My Image"
>



<br><br>



<a 
href="https://www.google.com"
target="_blank"
title="Open Google">

    Visit Google

</a>



<br><br>



<form>


<label>Name:</label>

<input 
type="text"
id="username"
class="input-box"
placeholder="Enter your name"
required
>


<br><br>


<input 
type="email"
placeholder="Enter email"
required
>


<br><br>


<button 
type="submit"
id="submit-btn"
class="button">

Submit

</button>


</form>



</body>

</html>
