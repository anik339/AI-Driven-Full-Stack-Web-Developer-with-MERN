<!DOCTYPE html>

<html lang="en">


<head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        HTML Accessibility Example
    </title>


</head>



<body>



<header>


    <h1>
        Web Accessibility
    </h1>


</header>




<nav aria-label="Main Navigation">


    <a href="#">
        Home
    </a>


    <a href="#">
        About
    </a>


    <a href="#">
        Contact
    </a>


</nav>




<main>



<section>


    <h2>
        About HTML Accessibility
    </h2>


    <p>
        Accessibility helps everyone use websites easily.
    </p>


</section>





<section>


    <h2>
        Profile Image
    </h2>


    <img 
    src="img_girl.jpg"
    alt="A person wearing a brown jacket"
    width="300"
    >


</section>





<section>


<h2>
    Contact Form
</h2>



<form>


<label for="name">
    Your Name:
</label>


<input 
type="text"
id="name"
name="name"
placeholder="Enter your name"
required
>



<br><br>




<label for="email">
    Your Email:
</label>


<input 
type="email"
id="email"
name="email"
required
>



<br><br>




<button 
type="submit"
aria-label="Submit contact form">

Submit

</button>



</form>



</section>



</main>





<footer>


<p>
    Copyright © 2026 My Website
</p>


</footer>



</body>


</html>
