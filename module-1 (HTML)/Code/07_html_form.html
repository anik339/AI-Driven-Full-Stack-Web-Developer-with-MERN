<!DOCTYPE html>
<!-- MODULE 1: 07 html form. Edit this example to learn the code. -->

<!-- ROOT: lang tells assistive tools which language this page uses. -->
<html lang="en">

<!-- HEAD: metadata, page title and linked resources live here. -->
<head>

  <meta charset="UTF-8">

  <!-- VIEWPORT: makes CSS adapt to phone and tablet widths. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Accessible labels, names, input types and browser-side validation.">

  <title>HTML Form Basics | HTML Only</title>
</head>

<!-- BODY: visible page content starts here. -->
<body>

<!-- HEADER: introduces the page or a content section. -->
<header>

    <p>HTML / Code Practice</p>

    <h1>HTML Form Basics</h1>

    <p>Accessible labels, names, input types and browser-side validation.</p>
  </header>

<!-- MAIN: contains the unique primary content of this page. -->
<main id="main-content">

<!-- SECTION: groups related content under a heading. -->
<section id="registration">

      <h2>Demo registration</h2>

      <p><small>Practice only: submission reloads this HTML page; no account or database is created.</small></p>

<!-- FORM: collects user input; backend processing is not implemented. -->
<form action="#registration" method="get">

        <p>
<!-- LABEL: names a field; matching for/id improves accessibility. -->
<label for="first-name">First name</label></p>

        <p>
<!-- INPUT: receives data; type controls validation and keyboard behavior. -->
<input id="first-name" name="firstName" type="text" autocomplete="given-name" required></p>

        <p><label for="email">Email address</label></p>

        <p><input id="email" name="email" type="email" autocomplete="email" required></p>

        <p><label for="phone">Phone number (optional)</label></p>

        <p><input id="phone" name="phone" type="tel" autocomplete="tel"></p>

        <p><label for="topic">Preferred topic</label></p>

        <p>
<!-- SELECT: offers a predefined list of choices. -->
<select id="topic" name="topic" required>

          <option value="">Choose a topic</option>

          <option value="html">HTML</option>

          <option value="semantic">Semantic HTML</option>
        </select></p>

        <p><label for="message">Short goal</label></p>

        <p>
<!-- TEXTAREA: accepts a longer, multi-line message. -->
<textarea id="message" name="goal" rows="4" cols="40"></textarea></p>

        <p>
<!-- BUTTON: choose type to avoid accidental form submission. -->
<button type="submit">Test submit</button> <button type="reset">Clear</button></p>
      </form>
    </section>
  </main>

<!-- FOOTER: provides end-of-page information. -->
<footer>

    <hr>

    <p>HTML-only learning example. No CSS, Tailwind, JavaScript or backend is included.</p>
  </footer>
</body>
</html>
