<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a small form demonstrating different input types.">
  <title>Common Input Types</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 18 of 50</p>
    <h1>Common Input Types</h1>
    <p>Create a small form demonstrating different input types.</p>
  </header>
  <main>
    <form>
      <p><label for="search">Search <input id="search" name="search" type="search"></label></p>
      <p><label for="website">Website <input id="website" name="website" type="url"></label></p>
      <p><label for="age">Age <input id="age" name="age" type="number" min="1" max="120"></label></p>
      <p><label for="birth-date">Birth date <input id="birth-date" name="birthDate" type="date"></label></p>
      <p><label for="satisfaction">Satisfaction <input id="satisfaction" name="satisfaction" type="range" min="0" max="10"></label></p>
    </form>
  </main>
</body>
</html>
