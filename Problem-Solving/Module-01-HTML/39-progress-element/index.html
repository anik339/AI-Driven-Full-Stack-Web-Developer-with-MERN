<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Show the progress of a course using progress.">
  <title>Progress Element</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 39 of 50</p>
    <h1>Progress Element</h1>
    <p>Show the progress of a course using progress.</p>
  </header>
  <main>
    <label for="course-progress">Course progress</label>
    <progress id="course-progress" value="36" max="50">36 of 50</progress>
    <p>36 of 50 practice tasks completed.</p>
  </main>
</body>
</html>
