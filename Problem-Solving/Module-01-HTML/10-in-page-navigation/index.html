<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Link navigation items to sections using fragment identifiers.">
  <title>In-Page Navigation</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 10 of 50</p>
    <h1>In-Page Navigation</h1>
    <p>Link navigation items to sections using fragment identifiers.</p>
  </header>
  <main>
    <nav aria-label="Page sections">
      <a href="#profile">Profile</a> |
      <a href="#skills">Skills</a> |
      <a href="#contact">Contact</a>
    </nav>
    <section id="profile"><h2>Profile</h2><p>My learning journey.</p></section>
    <section id="skills"><h2>Skills</h2><p>HTML and CSS basics.</p></section>
    <section id="contact"><h2>Contact</h2><p>Email: learner@example.com</p></section>
  </main>
</body>
</html>
