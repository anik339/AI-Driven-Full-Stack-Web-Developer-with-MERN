<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Represent a measurement within a known range.">
  <title>Meter Element</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 40 of 50</p>
    <h1>Meter Element</h1>
    <p>Represent a measurement within a known range.</p>
  </header>
  <main>
    <label for="battery">Laptop battery</label>
    <meter id="battery" min="0" max="100" low="20" high="80" optimum="100" value="72">72%</meter>
    <p>Battery level: 72 percent.</p>
  </main>
</body>
</html>
