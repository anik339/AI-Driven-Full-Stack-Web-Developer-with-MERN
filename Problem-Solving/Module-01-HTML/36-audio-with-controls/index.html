<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Embed an audio sample with controls and fallback text.">
  <title>Audio with Controls</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 36 of 50</p>
    <h1>Audio with Controls</h1>
    <p>Embed an audio sample with controls and fallback text.</p>
  </header>
  <main>
    <figure>
      <figcaption>Sample audio lesson</figcaption>
      <audio controls>
        <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
        Your browser does not support embedded audio.
      </audio>
    </figure>
  </main>
</body>
</html>
