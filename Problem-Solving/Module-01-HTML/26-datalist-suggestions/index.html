<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Offer suggested values while allowing custom input.">
  <title>Datalist Suggestions</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 26 of 50</p>
    <h1>Datalist Suggestions</h1>
    <p>Offer suggested values while allowing custom input.</p>
  </header>
  <main>
    <label for="editor">Preferred code editor</label>
    <input id="editor" name="editor" list="editors">
    <datalist id="editors">
      <option value="Visual Studio Code"></option>
      <option value="WebStorm"></option>
      <option value="Sublime Text"></option>
    </datalist>
  </main>
</body>
</html>
