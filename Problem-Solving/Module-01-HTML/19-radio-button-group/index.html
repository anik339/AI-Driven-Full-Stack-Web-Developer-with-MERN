<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Let a user select exactly one study schedule.">
  <title>Radio Button Group</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 19 of 50</p>
    <h1>Radio Button Group</h1>
    <p>Let a user select exactly one study schedule.</p>
  </header>
  <main>
    <fieldset>
      <legend>Choose your study schedule</legend>
      <label><input type="radio" name="schedule" value="morning" checked> Morning</label>
      <label><input type="radio" name="schedule" value="evening"> Evening</label>
      <label><input type="radio" name="schedule" value="weekend"> Weekend</label>
    </fieldset>
  </main>
</body>
</html>
