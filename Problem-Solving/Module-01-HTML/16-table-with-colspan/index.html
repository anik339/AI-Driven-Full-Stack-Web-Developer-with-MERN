<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Merge a header across two columns.">
  <title>Table with Colspan</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 16 of 50</p>
    <h1>Table with Colspan</h1>
    <p>Merge a header across two columns.</p>
  </header>
  <main>
    <table>
      <caption>Course fee summary</caption>
      <thead><tr><th scope="col">Course</th><th scope="col" colspan="2">Fee breakdown</th></tr></thead>
      <tbody>
        <tr><th scope="row">Frontend</th><td>Tuition: 5000</td><td>Materials: 500</td></tr>
        <tr><th scope="row">Backend</th><td>Tuition: 6000</td><td>Materials: 700</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
