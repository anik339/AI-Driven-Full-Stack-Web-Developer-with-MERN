<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Group related personal information fields.">
  <title>Fieldset and Legend</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 25 of 50</p>
    <h1>Fieldset and Legend</h1>
    <p>Group related personal information fields.</p>
  </header>
  <main>
    <form>
      <fieldset>
        <legend>Account information</legend>
        <p><label for="account-name">Name <input id="account-name" name="name"></label></p>
        <p><label for="account-email">Email <input id="account-email" name="email" type="email"></label></p>
      </fieldset>
    </form>
  </main>
</body>
</html>
