<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mark an article&#x27;s publication date with time datetime.">
  <title>Article with Author and Time</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 28 of 50</p>
    <h1>Article with Author and Time</h1>
    <p>Mark an article&#x27;s publication date with time datetime.</p>
  </header>
  <main>
    <article>
      <header>
        <h2>Why semantic HTML matters</h2>
        <p>Written by <span>Alex Morgan</span></p>
        <time datetime="2026-11-13">13 November 2026</time>
      </header>
      <p>Semantic markup makes the purpose of content clearer.</p>
      <footer><p>Category: HTML fundamentals</p></footer>
    </article>
  </main>
</body>
</html>
