<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a timetable with caption and scoped headers.">
  <title>Simple Data Table</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 15 of 50</p>
    <h1>Simple Data Table</h1>
    <p>Create a timetable with caption and scoped headers.</p>
  </header>
  <main>
    <table>
      <caption>Weekly study timetable</caption>
      <thead><tr><th scope="col">Day</th><th scope="col">Topic</th><th scope="col">Minutes</th></tr></thead>
      <tbody>
        <tr><th scope="row">Monday</th><td>HTML</td><td>60</td></tr>
        <tr><th scope="row">Tuesday</th><td>CSS</td><td>60</td></tr>
        <tr><th scope="row">Wednesday</th><td>JavaScript</td><td>75</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
