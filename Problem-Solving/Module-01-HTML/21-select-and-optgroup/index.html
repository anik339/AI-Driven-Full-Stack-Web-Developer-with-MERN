<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Organize course options into categories.">
  <title>Select and Optgroup</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 21 of 50</p>
    <h1>Select and Optgroup</h1>
    <p>Organize course options into categories.</p>
  </header>
  <main>
    <label for="course">Choose a course</label>
    <select id="course" name="course">
      <option value="">Select one</option>
      <optgroup label="Frontend">
        <option value="html">HTML</option><option value="css">CSS</option>
      </optgroup>
      <optgroup label="Backend">
        <option value="node">Node.js</option><option value="database">Database basics</option>
      </optgroup>
    </select>
  </main>
</body>
</html>
