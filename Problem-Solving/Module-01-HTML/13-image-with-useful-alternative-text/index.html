<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Add a local image with alt text and dimensions.">
  <title>Image with Useful Alternative Text</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 13 of 50</p>
    <h1>Image with Useful Alternative Text</h1>
    <p>Add a local image with alt text and dimensions.</p>
  </header>
  <main>
    <figure>
      <img src="https://placehold.co/640x360?text=Learning+Workspace"
           alt="A sample illustration representing a web developer's learning workspace"
           width="640" height="360">
      <figcaption>A workspace for daily coding practice.</figcaption>
    </figure>
  </main>
</body>
</html>
