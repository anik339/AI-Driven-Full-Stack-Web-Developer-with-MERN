<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mark a language change and isolate bidirectional text.">
  <title>Language and Direction Attributes</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 31 of 50</p>
    <h1>Language and Direction Attributes</h1>
    <p>Mark a language change and isolate bidirectional text.</p>
  </header>
  <main>
    <p lang="en">This sentence is in English.</p>
    <p lang="bn">এই বাক্যটি বাংলায় লেখা।</p>
    <p>Order code: <bdi>ABC-123</bdi></p>
    <p><bdo dir="rtl">This text is displayed right to left.</bdo></p>
  </main>
</body>
</html>
