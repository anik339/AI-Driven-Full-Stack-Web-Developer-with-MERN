<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Use picture and source to offer image alternatives.">
  <title>Responsive Image Sources</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 14 of 50</p>
    <h1>Responsive Image Sources</h1>
    <p>Use picture and source to offer image alternatives.</p>
  </header>
  <main>
    <picture>
      <source media="(max-width: 600px)" srcset="https://placehold.co/480x320?text=Mobile">
      <source media="(min-width: 601px)" srcset="https://placehold.co/960x480?text=Desktop">
      <img src="https://placehold.co/960x480?text=Fallback" alt="A responsive sample banner" width="960" height="480">
    </picture>
  </main>
</body>
</html>
