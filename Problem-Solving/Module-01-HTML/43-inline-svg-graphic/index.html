<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a small scalable graphic with inline SVG markup.">
  <title>Inline SVG Graphic</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 43 of 50</p>
    <h1>Inline SVG Graphic</h1>
    <p>Create a small scalable graphic with inline SVG markup.</p>
  </header>
  <main>
    <figure>
      <svg viewBox="0 0 240 120" width="240" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Simple landscape</title>
        <desc id="svg-desc">A sun above two green hills.</desc>
        <circle cx="190" cy="28" r="18" fill="#f6c453"></circle>
        <path d="M10 110 Q70 25 130 110 Z" fill="#6bbf8a"></path>
        <path d="M85 110 Q160 45 230 110 Z" fill="#3c9d75"></path>
      </svg>
      <figcaption>A simple inline SVG illustration.</figcaption>
    </figure>
  </main>
</body>
</html>
