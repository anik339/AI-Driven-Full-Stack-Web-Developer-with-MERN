<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Allow multiple technologies to be selected.">
  <title>Checkbox Group</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 20 of 50</p>
    <h1>Checkbox Group</h1>
    <p>Allow multiple technologies to be selected.</p>
  </header>
  <main>
    <fieldset>
      <legend>Technologies I want to learn</legend>
      <label><input type="checkbox" name="technology" value="react"> React</label>
      <label><input type="checkbox" name="technology" value="node"> Node.js</label>
      <label><input type="checkbox" name="technology" value="mongodb"> MongoDB</label>
    </fieldset>
  </main>
</body>
</html>
