<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Demonstrate submit, reset and plain buttons.">
  <title>Button Types</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 24 of 50</p>
    <h1>Button Types</h1>
    <p>Demonstrate submit, reset and plain buttons.</p>
  </header>
  <main>
    <form>
      <label for="demo-name">Name <input id="demo-name" name="name" value="Sample learner"></label>
      <button type="submit">Submit form</button>
      <button type="reset">Reset form</button>
      <button type="button">Plain button</button>
      <button type="button" disabled>Disabled action</button>
    </form>
  </main>
</body>
</html>
