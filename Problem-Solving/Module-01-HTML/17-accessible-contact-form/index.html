<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build a form with labels, names and appropriate input types.">
  <title>Accessible Contact Form</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 17 of 50</p>
    <h1>Accessible Contact Form</h1>
    <p>Build a form with labels, names and appropriate input types.</p>
  </header>
  <main>
    <form action="#" method="get">
      <p><label for="full-name">Full name</label><br><input id="full-name" name="fullName" type="text" autocomplete="name" required></p>
      <p><label for="email-address">Email</label><br><input id="email-address" name="email" type="email" autocomplete="email" required></p>
      <p><label for="message">Message</label><br><textarea id="message" name="message" rows="4" required></textarea></p>
      <button type="submit">Send sample message</button>
    </form>
  </main>
</body>
</html>
