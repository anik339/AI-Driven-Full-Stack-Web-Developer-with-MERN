<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Embed a small document using iframe srcdoc and a restrictive sandbox.">
  <title>Sandboxed Inline Frame</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 35 of 50</p>
    <h1>Sandboxed Inline Frame</h1>
    <p>Embed a small document using iframe srcdoc and a restrictive sandbox.</p>
  </header>
  <main>
    <iframe title="Embedded learning note" sandbox="" width="320" height="140"
      srcdoc="&lt;h2&gt;Embedded note&lt;/h2&gt;&lt;p&gt;This is a separate document.&lt;/p&gt;">
    </iframe>
  </main>
</body>
</html>
