<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a labelled message field with a length limit.">
  <title>Textarea with Character Guidance</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 22 of 50</p>
    <h1>Textarea with Character Guidance</h1>
    <p>Create a labelled message field with a length limit.</p>
  </header>
  <main>
    <form>
      <label for="feedback">Your feedback</label>
      <textarea id="feedback" name="feedback" rows="5" minlength="10" maxlength="300" required></textarea>
      <p>Enter between 10 and 300 characters.</p>
    </form>
  </main>
</body>
</html>
