<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Place inert reusable markup inside a template element.">
  <title>Template Element</title>

</head>
<body>
  <!-- MODULE 1: HTML-only practice. No CSS or JavaScript is used here. -->
  <header>
    <p>Module 01 · HTML · Problem 42 of 50</p>
    <h1>Template Element</h1>
    <p>Place inert reusable markup inside a template element.</p>
  </header>
  <main>
    <template id="card-template">
      <article>
        <h2>Reusable card title</h2>
        <p>This template content is not displayed by default.</p>
      </article>
    </template>
    <p>The template element stores markup for later use by JavaScript.</p>
  </main>
</body>
</html>
