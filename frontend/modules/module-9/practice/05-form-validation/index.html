<body><main><h1>Registration Check</h1><form id='form' novalidate><label for='email'>Email</label><input id='email' type='email' required><label for='password'>Password</label><input id='password' type='password' minlength='8' required><button type='submit'>Validate</button></form><p id='feedback' role='status' aria-live='polite'></p></main></body>
