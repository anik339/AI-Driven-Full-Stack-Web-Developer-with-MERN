<body><main><h1>Accessible Counter</h1><p>Use Tab to focus a button, then Enter or Space to activate it.</p><button id='minus' type='button' aria-label='Decrease count'>−</button> <output id='count' aria-live='polite'>0</output> <button id='plus' type='button' aria-label='Increase count'>+</button></main></body>
