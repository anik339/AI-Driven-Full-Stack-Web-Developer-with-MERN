<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Script, defer and async</title>
  <!-- defer downloads in parallel and executes after HTML parsing, in document order. -->
  <script defer src="defer-demo.js"></script>
  <!-- async downloads in parallel and executes as soon as ready; order is not guaranteed. -->
  <script async src="async-demo.js"></script>
</head>
<body>
  <h1>Connecting JavaScript to HTML</h1>
  <p id="defer-output">The deferred script has not updated this message yet.</p>
  <p>Open DevTools Console (F12) and refresh the page to compare script execution.</p>
  <noscript><p>JavaScript is disabled. This page's interactive examples will not run.</p></noscript>
</body>
</html>
