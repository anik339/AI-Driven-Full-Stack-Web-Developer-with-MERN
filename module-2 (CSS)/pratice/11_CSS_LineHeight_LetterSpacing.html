<!DOCTYPE html>
<html>

<head>

    <title>CSS Line Height and Letter Spacing</title>


    <!-- CSS File -->

    <link rel="stylesheet" href="style11.css">


</head>


<body>


    <h1>

        CSS Text Spacing

    </h1>



    <p class="line">

        This is an example of line height.
        Line height controls the space between two lines of text.
        It makes the paragraph more readable.

    </p>



    <p class="letter">

        This text uses letter spacing property.

    </p>



    <p class="word">

        This text uses word spacing property.

    </p>



    <p class="indent">

        This paragraph has text indentation.

    </p>



</body>

</html>
