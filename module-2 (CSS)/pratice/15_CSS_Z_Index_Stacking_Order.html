<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        CSS Z Index and Stacking Order
    </title>


    <link rel="stylesheet" href="style15.css">


</head>


<body>


<!-- Website Navbar -->

<header class="navbar">


    <h1>
        MERN Stack Developer Dashboard
    </h1>


    <nav>

        <a href="#">
            Home
        </a>

        <a href="#">
            Projects
        </a>

        <a href="#">
            Contact
        </a>

    </nav>


</header>





<!-- Profile Card -->


<section class="profile-section">


<h2>
    Developer Profile Card
</h2>



<div class="profile-card">


    <img 
    src="https://i.pravatar.cc/300"
    alt="Developer Profile">



    <div class="profile-details">


        <h3>
            Full Stack MERN Developer
        </h3>


        <p>
            React | Node.js | Express | MongoDB
        </p>


    </div>



    <!-- Absolute Badge -->

    <span class="online-badge">

        Online

    </span>



</div>



</section>








<!-- Stacking Order Example -->


<section class="layer-section">


<h2>
    Stacking Order Layers
</h2>



<div class="layer-container">


    <div class="layer backend-layer">

        Backend

    </div>



    <div class="layer frontend-layer">

        Frontend

    </div>



    <div class="layer popup-layer">

        Notification

    </div>



</div>


</section>








<!-- Modal Example -->


<div class="modal">


    <h2>
        Login Required
    </h2>


    <p>
        Please login to access developer dashboard.
    </p>


    <button>
        Login
    </button>


</div>







<!-- Floating Chat -->


<button class="chat-button">

    Chat

</button>





</body>

</html>
