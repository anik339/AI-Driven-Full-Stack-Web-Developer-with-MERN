<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Form Styling</title>

<link rel="stylesheet" href="style21.css">

</head>


<body>


<h1>CSS Form Styling</h1>



<div class="form-container">


<form>


<label>
Full Name
</label>

<input 
type="text"
placeholder="Enter your name">





<label>
Email Address
</label>


<input 
type="email"
placeholder="Enter your email">





<label>
Password
</label>


<input 
type="password"
placeholder="Enter password">





<label>
Country
</label>


<select>

<option>Select Country</option>

<option>Bangladesh</option>

<option>India</option>

<option>USA</option>

</select>





<label>
Message
</label>


<textarea 
placeholder="Write your message">
</textarea>





<div class="option">


<label>

<input type="checkbox">

Remember Me

</label>


</div>





<button type="submit">

Submit

</button>



</form>


</div>



</body>

</html>
