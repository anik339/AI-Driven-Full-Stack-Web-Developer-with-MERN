<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Responsive Image & Video</title>

<link rel="stylesheet" href="style32.css">

</head>


<body>


<h1>CSS Responsive Image & Video</h1>



<!-- 1 Responsive Image -->

<section>

<h2>1. Responsive Image</h2>


<div class="image-container">

<img 
src="https://picsum.photos/900/500"
alt="Responsive Image"
loading="lazy">

</div>

</section>








<!-- 2 Object Fit -->


<section>

<h2>2. Object Fit Image</h2>


<div class="profile-box">

<img 
src="https://picsum.photos/600/600"
alt="Profile Image">

</div>


</section>








<!-- 3 Object Position -->


<section>

<h2>3. Object Position</h2>


<div class="position-box">


<img 
src="https://picsum.photos/800/500"
alt="Object Position">


</div>


</section>









<!-- 4 Picture Element -->


<section>


<h2>4. Picture Element Responsive Image</h2>


<picture>


<source 
media="(max-width:600px)"
srcset="https://picsum.photos/500/500">



<img

src="https://picsum.photos/1000/500"

alt="Responsive Picture"

loading="lazy">


</picture>


</section>









<!-- 5 Local Video -->


<section>


<h2>5. Responsive Local Video</h2>


<div class="video-container">


<video controls>


<source src="video.mp4" type="video/mp4">


Your browser does not support video.


</video>


</div>


</section>









<!-- 6 YouTube Video -->


<section>


<h2>6. Responsive YouTube Video</h2>


<div class="youtube-container">


<iframe

src="https://www.youtube.com/embed/ScMzIvxBSi4"

title="YouTube Video"

allowfullscreen>

</iframe>


</div>


</section>









<!-- 7 Aspect Ratio -->


<section>


<h2>7. Aspect Ratio Video</h2>


<div class="aspect-video">


<iframe

src="https://www.youtube.com/embed/ScMzIvxBSi4"

allowfullscreen>

</iframe>


</div>


</section>





</body>

</html>
