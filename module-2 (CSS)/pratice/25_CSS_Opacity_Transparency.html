<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Opacity & Transparency</title>

<link rel="stylesheet" href="style25.css">

</head>


<body>


<h1>CSS Opacity & Transparency</h1>




<section>

<h2>1. Opacity Property</h2>


<div class="opacity-box">

Opacity 50%

</div>


</section>







<section>

<h2>2. RGBA Transparency</h2>


<div class="rgba-box">

RGBA Transparent Background

</div>


</section>








<section>

<h2>3. Image Transparency</h2>


<img 
src="https://picsum.photos/400/250"
class="image-opacity"
alt="Sample Image">


</section>








<section>

<h2>4. Hover Transparency Effect</h2>


<div class="hover-box">

Hover Me

</div>


</section>








<section>

<h2>5. Overlay Effect</h2>


<div class="card">


<img 
src="https://picsum.photos/500/300"
alt="image">


<div class="overlay">

Modern Web Design

</div>


</div>


</section>





</body>

</html>
