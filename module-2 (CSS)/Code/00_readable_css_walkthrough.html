<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Module 2 - Why These CSS Rules?</title>
  <!-- LINK WHY: place reusable styles in a separate file, not on every tag. -->
  <link rel="stylesheet" href="00_readable_css_walkthrough.css">
</head>
<body>
  <main class="container">
    <!-- HERO WHY: introduce the topic before showing examples. -->
    <header class="hero">
      <h1>Read a CSS Layout</h1>
      <p>Try changing the CSS values, save, and refresh.</p>
    </header>
    <!-- GRID WHY: the cards form a responsive set of columns. -->
    <section class="cards" aria-label="Layout examples">
      <article class="card"><h2>Box Model</h2><p>Padding is inside; margin is outside.</p></article>
      <article class="card"><h2>Flex and Grid</h2><p>Grid arranges this set of cards.</p></article>
      <article class="card"><h2>Responsive</h2><p>Cards stack at narrow widths.</p></article>
    </section>
  </main>
</body>
</html>
