<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create, search, edit, and pin notes using vanilla JavaScript.">
  <title>Notes Manager | JavaScript Project 06</title><link rel="stylesheet" href="./styles.css"><script src="./script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header><p class="eyebrow">JavaScript Project 06</p><h1>Keep your thoughts in one place.</h1><p class="subtitle">Create notes, edit them later, pin important ideas, and search your saved notes.</p></header>
    <div class="notes-layout">
      <section class="panel panel-pad editor">
        <h2 id="editor-heading">New note</h2>
        <form id="note-form" class="stack">
          <div class="field"><label for="note-title">Title</label><input id="note-title" maxlength="70" placeholder="Give your note a title" required></div>
          <div class="field"><label for="note-body">Note</label><textarea id="note-body" maxlength="1500" placeholder="Write your idea here…" required></textarea></div>
          <div class="row"><button id="save-note" class="btn" type="submit">Save note</button><button id="cancel-edit" class="btn btn-secondary" type="button" hidden>Cancel edit</button></div>
          <p id="form-status" class="status-message" aria-live="polite"></p>
        </form>
      </section>
      <section class="notes-area">
        <div class="toolbar panel panel-pad">
          <label class="sr-only" for="note-search">Search notes</label><input id="note-search" type="search" placeholder="Search your notes…">
          <select id="note-filter" aria-label="Filter notes"><option value="all">All notes</option><option value="pinned">Pinned only</option></select>
        </div>
        <div id="notes-grid" class="notes-grid" aria-live="polite"></div>
        <p id="empty-state" class="empty-state">No notes yet. Write your first note.</p>
      </section>
    </div>
    <footer>Project 06 · Notes are saved locally in this browser, not synced to an account.</footer>
  </main>
</body>
</html>
