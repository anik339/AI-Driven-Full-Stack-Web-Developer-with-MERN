<!DOCTYPE html>
<!-- Learning note: Animation | module-3 (Tailwind CSS)/pratice/20_Transitions_Animations_Tailwind/animation.html -->


<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Transitions Animations Tailwind
</title>


<link rel="stylesheet" href="./src/animation-output.css">


</head>


<body class="bg-gray-100 p-10">


<h1 class="
text-4xl
font-bold
text-center
text-blue-600
mb-10
">

Transitions & Animations

</h1>









<!-- Transition -->


<section class="mb-10">


<h2 class="text-2xl font-bold mb-5">

1. Transition

</h2>



<button class="
bg-blue-600
text-white
px-6
py-3
rounded-lg
transition
duration-500
hover:bg-blue-900
">

Hover Button

</button>



</section>









<!-- Transform Scale -->


<section class="mb-10">


<h2 class="text-2xl font-bold mb-5">

2. Scale Transform

</h2>



<div class="
w-40
h-40
bg-green-500
text-white
flex
items-center
justify-center
rounded-xl
transition
duration-300
hover:scale-110
">

Scale

</div>



</section>









<!-- Rotate -->


<section class="mb-10">


<h2 class="text-2xl font-bold mb-5">

3. Rotate

</h2>



<div class="
w-32
h-32
bg-purple-600
text-white
flex
items-center
justify-center
rounded-lg
transition
hover:rotate-45
">

Rotate

</div>


</section>









<!-- Translate -->


<section class="mb-10">


<h2 class="text-2xl font-bold mb-5">

4. Translate

</h2>



<div class="
w-40
h-20
bg-red-500
text-white
flex
items-center
justify-center
transition
hover:translate-x-10
">

Move Right

</div>



</section>









<!-- Animation -->


<section>


<h2 class="text-2xl font-bold mb-5">

5. Built-in Animation

</h2>



<div class="
w-20
h-20
bg-yellow-500
rounded-full
animate-bounce
">

</div>



<div class="
mt-5
w-20
h-20
bg-blue-500
rounded-full
animate-spin
">

</div>



</section>







</body>

</html>
