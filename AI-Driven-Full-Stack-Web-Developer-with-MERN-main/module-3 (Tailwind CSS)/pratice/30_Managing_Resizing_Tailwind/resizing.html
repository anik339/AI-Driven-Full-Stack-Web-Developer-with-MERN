<!DOCTYPE html>
<!-- Learning note: Resizing | module-3 (Tailwind CSS)/pratice/30_Managing_Resizing_Tailwind/resizing.html -->

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Managing Resizing Tailwind CSS
</title>

<link rel="stylesheet" href="./src/output.css">

</head>


<body class="bg-gray-100 p-8">


<div class="max-w-6xl mx-auto">


<!-- Header -->

<div class="text-center mb-12">


<h1 class="text-5xl font-bold text-blue-600 mb-4">

Managing Resizing in Tailwind CSS

</h1>


<p class="text-gray-600 text-lg">

Learn width, height and resize utilities.

</p>


</div>





<!-- Width Section -->

<section class="bg-white p-8 rounded-2xl shadow-xl mb-10">


<h2 class="text-3xl font-bold mb-6">

1. Width Control

</h2>


<div class="space-y-5">


<div class="w-1/2 bg-blue-600 text-white p-5 rounded-xl">

Width 50%

</div>



<div class="w-full bg-green-600 text-white p-5 rounded-xl">

Width Full

</div>



<div class="w-64 bg-purple-600 text-white p-5 rounded-xl">

Fixed Width

</div>


</div>


</section>







<!-- Height Section -->

<section class="bg-white p-8 rounded-2xl shadow-xl mb-10">


<h2 class="text-3xl font-bold mb-6">

2. Height Control

</h2>


<div class="flex gap-5 items-end">


<div class="h-24 w-24 bg-blue-500 text-white flex items-center justify-center rounded-xl">

h-24

</div>


<div class="h-40 w-24 bg-green-500 text-white flex items-center justify-center rounded-xl">

h-40

</div>


<div class="h-56 w-24 bg-purple-500 text-white flex items-center justify-center rounded-xl">

h-56

</div>


</div>


</section>







<!-- Min Max Width -->

<section class="bg-white p-8 rounded-2xl shadow-xl mb-10">


<h2 class="text-3xl font-bold mb-6">

3. Min & Max Width

</h2>


<div class="min-w-full max-w-xl bg-orange-500 text-white p-6 rounded-xl">

This box uses minimum and maximum width.

</div>


</section>







<!-- Resize -->

<section class="bg-white p-8 rounded-2xl shadow-xl">


<h2 class="text-3xl font-bold mb-6">

4. Resize Utilities

</h2>


<textarea

class="w-full h-40 border-2 border-blue-500 rounded-xl p-5 resize"

placeholder="Try resizing this textarea">

</textarea>


</section>





</div>


</body>

</html>
