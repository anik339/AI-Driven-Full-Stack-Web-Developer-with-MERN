<!DOCTYPE html>
<!-- Learning note: Transformations | module-3 (Tailwind CSS)/pratice/31_Transformations_Tailwind/transformations.html -->

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Transformations Tailwind CSS
</title>


<link rel="stylesheet" href="./src/output.css">

</head>



<body class="bg-gray-100 p-8">



<div class="max-w-7xl mx-auto">



<!-- Header -->

<div class="text-center mb-12">


<h1 class="text-5xl font-bold text-blue-600 mb-4">

Transformations in Tailwind CSS

</h1>


<p class="text-gray-600 text-lg">

Learn translate, scale, rotate, skew and transform origin.

</p>


</div>









<!-- Translate -->

<section class="bg-white p-8 rounded-2xl shadow-xl mb-10">


<h2 class="text-3xl font-bold mb-6">

1. Translate Transform

</h2>



<div class="flex justify-center">


<div class="bg-blue-600 text-white p-8 rounded-xl transition hover:translate-x-10">

Move Right

</div>


</div>


</section>









<!-- Scale -->

<section class="bg-white p-8 rounded-2xl shadow-xl mb-10">


<h2 class="text-3xl font-bold mb-6">

2. Scale Transform

</h2>



<div class="grid md:grid-cols-3 gap-6">



<div class="bg-green-600 text-white p-8 rounded-xl transition hover:scale-110">

Scale 110%

</div>





<div class="bg-purple-600 text-white p-8 rounded-xl transition hover:scale-125">

Scale 125%

</div>





<div class="bg-orange-500 text-white p-8 rounded-xl transition hover:scale-95">

Scale 95%

</div>



</div>


</section>









<!-- Rotate -->

<section class="bg-white p-8 rounded-2xl shadow-xl mb-10">


<h2 class="text-3xl font-bold mb-6">

3. Rotate Transform

</h2>



<div class="flex justify-center gap-8">



<div class="bg-red-500 text-white p-8 rounded-xl transition hover:rotate-12">

Rotate +12°

</div>





<div class="bg-indigo-600 text-white p-8 rounded-xl transition hover:-rotate-12">

Rotate -12°

</div>



</div>


</section>









<!-- Skew -->

<section class="bg-white p-8 rounded-2xl shadow-xl mb-10">


<h2 class="text-3xl font-bold mb-6">

4. Skew Transform

</h2>




<div class="grid md:grid-cols-2 gap-6">



<div class="bg-pink-600 text-white p-8 rounded-xl transition hover:skew-x-12">

Skew X

</div>





<div class="bg-teal-600 text-white p-8 rounded-xl transition hover:skew-y-12">

Skew Y

</div>



</div>



</section>









<!-- Transform Origin -->

<section class="bg-white p-8 rounded-2xl shadow-xl">


<h2 class="text-3xl font-bold mb-6">

5. Transform Origin

</h2>




<div class="flex justify-center">


<div class="w-40 h-40 bg-yellow-500 flex items-center justify-center rounded-xl text-white font-bold transition origin-top-left hover:rotate-45">


Origin Top Left

</div>


</div>



</section>







</div>



</body>


</html>
