<!DOCTYPE html>
<!-- Learning note: 23 Css Custom Checkbox Radio Button | module-2 (CSS)/pratice/23_CSS_Custom_Checkbox_Radio_Button.html -->

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Custom Checkbox & Radio Button</title>

<link rel="stylesheet" href="style23.css">

</head>


<body>


<h1>Custom Checkbox & Radio Button</h1>



<div class="form-box">


<h2>Custom Checkbox</h2>


<label class="check-container">

I agree with terms and conditions

<input type="checkbox">

<span class="checkmark"></span>

</label>





<label class="check-container">

Subscribe Newsletter

<input type="checkbox">

<span class="checkmark"></span>

</label>







<h2>Custom Radio Button</h2>




<label class="radio-container">

Frontend Developer

<input type="radio" name="role">

<span class="radio-mark"></span>

</label>





<label class="radio-container">

Backend Developer

<input type="radio" name="role">

<span class="radio-mark"></span>

</label>





<label class="radio-container">

Full Stack Developer

<input type="radio" name="role">

<span class="radio-mark"></span>

</label>



</div>



</body>

</html>
