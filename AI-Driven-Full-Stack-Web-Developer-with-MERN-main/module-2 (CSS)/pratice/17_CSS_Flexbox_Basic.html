<!DOCTYPE html>
<!-- Learning note: 17 Css Flexbox Basic | module-2 (CSS)/pratice/17_CSS_Flexbox_Basic.html -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Flexbox Basic</title>

    <link rel="stylesheet" href="style17.css">

</head>


<body>


    <h1>CSS Flexbox Basic</h1>


    <!-- Row Axis Example -->

    <section>

        <h2>Flex Direction: Row (Default)</h2>

        <div class="flex-row">

            <div class="box box1">HTML</div>

            <div class="box box2">CSS</div>

            <div class="box box3">JavaScript</div>

        </div>

    </section>



    <!-- Column Axis Example -->


    <section>

        <h2>Flex Direction: Column</h2>


        <div class="flex-column">


            <div class="box box1">React</div>

            <div class="box box2">Node JS</div>

            <div class="box box3">MongoDB</div>


        </div>


    </section>



    <!-- Center Alignment Example -->


    <section>

        <h2>Justify Content & Align Items</h2>


        <div class="center-box">


            <div class="box">

                Full Stack Developer

            </div>


        </div>


    </section>



</body>

</html>
