<!DOCTYPE html>
<!-- Learning note: 12 Css Display Property | module-2 (CSS)/pratice/12_CSS_Display_Property.html -->

<html>

<head>

    <title>CSS Display Property</title>


    <!-- CSS File -->

    <link rel="stylesheet" href="style12.css">


</head>


<body>


    <h1>
        CSS Display Property
    </h1>



    <!-- Block Display -->

    <h2>
        Display Block
    </h2>


    <div class="block-box">

        Block 1

    </div>


    <div class="block-box">

        Block 2

    </div>





    <!-- Inline Display -->

    <h2>
        Display Inline
    </h2>


    <span class="inline-box">

        Inline 1

    </span>


    <span class="inline-box">

        Inline 2

    </span>





    <!-- Flex Display -->

    <h2>
        Display Flex
    </h2>


    <div class="flex-container">


        <div class="item">

            Box 1

        </div>


        <div class="item">

            Box 2

        </div>


        <div class="item">

            Box 3

        </div>


    </div>





    <!-- Grid Display -->

    <h2>
        Display Grid
    </h2>


    <div class="grid-container">


        <div class="grid-item">

            1

        </div>


        <div class="grid-item">

            2

        </div>


        <div class="grid-item">

            3

        </div>


        <div class="grid-item">

            4

        </div>


    </div>



</body>

</html>
