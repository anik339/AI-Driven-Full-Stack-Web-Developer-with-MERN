<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML iframe Example</title>

</head>


<body>


<h1>HTML iframe Embedding Content</h1>



<h2>1. Embedding Ostad Website</h2>


<iframe

    src="https://ostad.app"

    width="800"

    height="500"

    title="Ostad Website"

    loading="lazy">

</iframe>



<br><br>



<h2>2. Embedding Google Map</h2>


<iframe

    src="https://www.google.com/maps?q=Dhaka+Bangladesh&output=embed"

    width="800"

    height="450"

    title="Google Map"

    loading="lazy">

</iframe>



<br><br>



<h2>3. Embedding YouTube Video</h2>


<iframe

    width="560"

    height="315"

    src="https://www.youtube.com/embed/tgbNymZ7vqY"

    title="YouTube Video"

    allowfullscreen>

</iframe>



</body>

</html>
