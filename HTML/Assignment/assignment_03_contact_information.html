<!DOCTYPE html>
<html>

<head>
    <title>Smart Phone Contact Information</title>
</head>

<body>

<h1>Smart Phone Contact Information Form</h1>

<form>

    <!-- Text Input -->
    <label>Full Name:</label>
    <input type="text" name="name" placeholder="Enter your name">
    <br><br>


    <!-- Email Input -->
    <label>Email:</label>
    <input type="email" name="email" placeholder="Enter your email">
    <br><br>


    <!-- Password Input -->
    <label>Password:</label>
    <input type="password" name="password">
    <br><br>


    <!-- Phone Input -->
    <label>Mobile Number:</label>
    <input type="tel" name="phone" placeholder="01XXXXXXXXX">
    <br><br>


    <!-- Number Input -->
    <label>Age:</label>
    <input type="number" name="age">
    <br><br>


    <!-- Date Input -->
    <label>Date of Purchase:</label>
    <input type="date" name="date">
    <br><br>


    <!-- Smartphone Brand -->
    <label>Select Smartphone Brand:</label>

    <select>
        <option>Samsung</option>
        <option>Apple iPhone</option>
        <option>Google Pixel</option>
        <option>OnePlus</option>
        <option>Xiaomi</option>
        <option>Vivo</option>
    </select>

    <br><br>


    <!-- Radio Button -->
    <label>Phone Condition:</label>

    <input type="radio" name="condition">
    New Phone

    <input type="radio" name="condition">
    Used Phone

    <br><br>


    <!-- Checkbox -->
    <label>Accessories Required:</label>

    <br>

    <input type="checkbox">
    Charger

    <input type="checkbox">
    Earphone

    <input type="checkbox">
    Cover

    <input type="checkbox">
    Screen Protector

    <br><br>


    <!-- Color Input -->
    <label>Phone Color:</label>
    <input type="color">

    <br><br>


    <!-- Range Input -->
    <label>Budget Range:</label>
    <input type="range">

    <br><br>


    <!-- File Input -->
    <label>Upload Customer Photo:</label>
    <input type="file">

    <br><br>


    <!-- URL Input -->
    <label>Previous Phone Website:</label>
    <input type="url" placeholder="https://example.com">

    <br><br>


    <!-- Search Input -->
    <label>Search Phone Model:</label>
    <input type="search" placeholder="Search">

    <br><br>


    <!-- Address -->
    <label>Delivery Address:</label>

    <br>

    <textarea rows="5" cols="40"></textarea>

    <br><br>


    <!-- Payment Method -->
    <label>Payment Method:</label>

    <select>
        <option>Cash on Delivery</option>
        <option>Credit Card</option>
        <option>Mobile Banking</option>
        <option>Bank Transfer</option>
    </select>

    <br><br>


    <!-- Submit and Reset -->
    <input type="submit" value="Submit">

    <input type="reset" value="Reset">


</form>

</body>

</html>
