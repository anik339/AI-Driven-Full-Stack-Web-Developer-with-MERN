<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Tailwind Spacing
</title>


<link rel="stylesheet" href="./src/spacing-output.css">


</head>


<body class="bg-gray-100 p-10">


<h1 class="
text-4xl
font-bold
text-center
text-blue-600
mb-10
">

Spacing in Tailwind CSS

</h1>





<!-- Padding -->

<section class="mb-10">


<h2 class="text-2xl font-bold mb-5">

1. Padding

</h2>



<div class="
bg-blue-600
text-white
p-10
rounded-lg
">

Padding 40px all side

</div>


</section>








<!-- Individual Padding -->


<section class="mb-10">


<h2 class="text-2xl font-bold mb-5">

2. Individual Padding

</h2>



<div class="
bg-green-600
text-white
pt-10
pb-5
pl-8
pr-8
rounded-lg
">

Top Bottom Left Right Padding

</div>


</section>








<!-- Margin -->


<section class="mb-10">


<h2 class="text-2xl font-bold mb-5">

3. Margin

</h2>



<div class="
bg-white
p-5
m-10
shadow-lg
rounded-lg
">

Margin Around Box

</div>


</section>








<!-- Gap -->


<section class="mb-10">


<h2 class="text-2xl font-bold mb-5">

4. Gap

</h2>



<div class="
flex
gap-5
">


<div class="
bg-red-500
text-white
p-5
">

Box 1

</div>



<div class="
bg-green-500
text-white
p-5
">

Box 2

</div>



<div class="
bg-blue-500
text-white
p-5
">

Box 3

</div>


</div>


</section>









<!-- Space -->


<section>


<h2 class="text-2xl font-bold mb-5">

5. Space Between

</h2>



<div class="
flex
flex-col
space-y-5
">


<div class="
bg-white
p-5
shadow
">

Item 1

</div>


<div class="
bg-white
p-5
shadow
">

Item 2

</div>


<div class="
bg-white
p-5
shadow
">

Item 3

</div>



</div>


</section>





</body>
