<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Background Tailwind
</title>


<link rel="stylesheet" href="./src/background-output.css">

</head>


<body class="bg-gray-100 p-10">


<h1 class="
text-4xl
font-bold
text-center
text-blue-600
mb-10
">

Background in Tailwind CSS

</h1>






<!-- Background Color -->

<section class="mb-10">


<h2 class="text-2xl font-bold mb-5">

1. Background Color

</h2>


<div class="
bg-blue-600
text-white
p-8
rounded-xl
">

Blue Background

</div>


</section>








<!-- Gradient -->


<section class="mb-10">


<h2 class="text-2xl font-bold mb-5">

2. Gradient Background

</h2>



<div class="
bg-gradient-to-r
from-blue-500
to-purple-600
text-white
p-10
rounded-xl
">

Blue To Purple Gradient

</div>


</section>








<!-- Background Image -->


<section class="mb-10">


<h2 class="text-2xl font-bold mb-5">

3. Background Image

</h2>



<div class="
h-64
bg-[url('https://picsum.photos/800/400')]
bg-cover
bg-center
rounded-xl
">

</div>


</section>








<!-- Background Size -->


<section class="mb-10">


<h2 class="text-2xl font-bold mb-5">

4. Background Size

</h2>



<div class="
h-48
bg-blue-500
bg-cover
rounded-xl
">

Background Cover

</div>



</section>









<!-- Background Position -->


<section>


<h2 class="text-2xl font-bold mb-5">

5. Background Position

</h2>



<div class="
h-48
bg-green-600
bg-center
rounded-xl
">

Center Position

</div>



</section>






</body>

</html>
