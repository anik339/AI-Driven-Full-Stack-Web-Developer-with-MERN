<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Customizing Forms Tailwind
    </title>


    <!-- Tailwind CSS Output -->
    <link rel="stylesheet" href="./src/output.css">

</head>


<body class="bg-gray-100 p-8">


<div class="max-w-4xl mx-auto">



    <!-- Page Header -->
    <div class="text-center mb-12">


        <h1 class="text-4xl md:text-5xl font-bold text-blue-600 mb-4">

            Customizing Forms with Tailwind CSS

        </h1>


        <p class="text-gray-600 text-lg">

            Create modern inputs, checkboxes, selects and buttons.

        </p>


    </div>








    <!-- Form Card -->
    <div class="bg-white p-8 rounded-2xl shadow-xl">



        <form class="space-y-6">



            <!-- Name Input -->
            <div>


                <label class="block text-gray-700 font-bold mb-2">

                    Full Name

                </label>


                <input 
                type="text"
                placeholder="Enter your name"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">


            </div>







            <!-- Email Input -->
            <div>


                <label class="block text-gray-700 font-bold mb-2">

                    Email Address

                </label>


                <input 
                type="email"
                placeholder="example@gmail.com"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">


            </div>








            <!-- Password Input -->
            <div>


                <label class="block text-gray-700 font-bold mb-2">

                    Password

                </label>


                <input 
                type="password"
                placeholder="Enter password"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500">


            </div>








            <!-- Select Dropdown -->
            <div>


                <label class="block text-gray-700 font-bold mb-2">

                    Select Course

                </label>


                <select class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">


                    <option>
                        HTML & CSS
                    </option>


                    <option>
                        Tailwind CSS
                    </option>


                    <option>
                        JavaScript
                    </option>


                    <option>
                        React JS
                    </option>


                </select>


            </div>








            <!-- Checkbox -->
            <div class="flex items-center gap-3">


                <input 
                type="checkbox"
                class="w-5 h-5 accent-blue-600">


                <label class="text-gray-700">

                    I agree with terms and conditions

                </label>


            </div>








            <!-- Radio Buttons -->
            <div>


                <p class="font-bold text-gray-700 mb-3">

                    Choose Account Type

                </p>



                <div class="flex gap-6">


                    <label class="flex items-center gap-2">

                        <input 
                        type="radio"
                        name="account"
                        class="accent-blue-600">

                        Student

                    </label>





                    <label class="flex items-center gap-2">

                        <input 
                        type="radio"
                        name="account"
                        class="accent-blue-600">

                        Developer

                    </label>


                </div>


            </div>








            <!-- Text Area -->
            <div>


                <label class="block text-gray-700 font-bold mb-2">

                    Message

                </label>



                <textarea 
                rows="4"
                placeholder="Write your message..."
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>


            </div>








            <!-- Submit Button -->
            <button 
            type="submit"
            class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">


                Submit Form


            </button>



        </form>


    </div>





</div>


</body>

</html>
