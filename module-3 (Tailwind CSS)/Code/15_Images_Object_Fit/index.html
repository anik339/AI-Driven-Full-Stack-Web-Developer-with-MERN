<!doctype html>
<!-- RESPONSIVE: sm:, md: and lg: apply styles at wider breakpoints. -->
<!-- MODULE 3: index. Edit this example to learn the code. -->

<!-- ROOT: lang tells assistive tools which language this page uses. -->
<html lang="en">

<!-- HEAD: metadata, page title and linked resources live here. -->
<head>
  <meta charset="UTF-8">
  <!-- VIEWPORT: makes CSS adapt to phone and tablet widths. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tailwind CSS learning practice with short Bangla explanations.">
  <title>Images and object fit | Tailwind CSS Practice</title>
  <!-- TAILWIND v4: browser CDN for learning only; no custom JavaScript. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<!-- BODY: visible page content starts here. -->
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">

<!-- HEADER: introduces the page or a content section. -->
<header class="border-b border-slate-200 bg-white">
    <!-- RESPONSIVE WHY: sm:/md:/lg: classes change layout from smaller to larger screens. -->
    <!-- FLEX WHY: flex aligns content along one main axis; justify and items control alignment. -->
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-4 sm:px-6">
      
<!-- LINK: href sets the destination; prefer real URLs or section IDs. -->
<a href="../index.html" class="font-bold text-indigo-700 hover:text-indigo-900">← All lessons</a>
      <span class="rounded-full bg-indigo-50 px-3 py-1 text-xs font-semibold text-indigo-700">TAILWIND CSS · PRACTICE</span>
    </div>
  </header>
  
<!-- MAIN: primary content. Utilities such as p-6, grid, and md: control layout. -->
<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
    
<!-- SECTION: groups related content under a heading. -->
<section class="mb-8 max-w-3xl">
      <p class="mb-2 text-xs font-bold uppercase tracking-[0.2em] text-indigo-600">Learn · Try · Change</p>
      <h1 class="text-3xl font-black tracking-tight text-slate-950 sm:text-4xl">Images and object fit</h1>
      <p class="mt-3 text-base leading-7 text-slate-600">Image-এর size, crop এবং aspect ratio নিয়ন্ত্রণ করুন; alt text অবশ্যই meaningful রাখুন।</p>
    </section>

<!-- GRID WHY: grid divides items into rows and columns; gap controls the spacing. -->
<div class="grid gap-5 sm:grid-cols-2">
  
<!-- FIGURE: groups a media item with its caption. -->
<figure class="overflow-hidden rounded-2xl bg-white shadow-sm">
<!-- IMAGE: src loads the file; alt describes its meaning. -->
<img src="../assets/profile.jpg" alt="Learner profile photograph" class="h-64 w-full object-cover object-center"><figcaption class="p-4"><p class="font-bold">object-cover</p><p class="mt-1 text-sm text-slate-600">Box পূরণ করতে image crop হতে পারে।</p></figcaption></figure>
  <figure class="rounded-2xl bg-white p-4 shadow-sm"><div class="grid h-64 place-items-center overflow-hidden rounded-xl bg-slate-100"><img src="../assets/profile.jpg" alt="Learner profile photograph displayed without forced cropping" class="max-h-full max-w-full object-contain"></div><figcaption class="pt-4"><p class="font-bold">object-contain</p><p class="mt-1 text-sm text-slate-600">পুরো image দেখা যায়; ফাঁকা জায়গা থাকতে পারে।</p></figcaption></figure>
</div>

  </main>

<!-- FOOTER: provides end-of-page information. -->
<footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto max-w-6xl px-4 py-5 text-sm text-slate-500 sm:px-6">Practice tip: change one utility class at a time and observe the result.</div>
  </footer>
</body>
</html>
