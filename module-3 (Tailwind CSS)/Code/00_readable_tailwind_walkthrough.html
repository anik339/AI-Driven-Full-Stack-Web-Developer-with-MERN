<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Module 3 - Tailwind Classes Explained</title>
  <!-- CDN WHY: browser builds Tailwind utilities for practice only (internet needed). -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body id="top" class="min-h-screen bg-slate-50 text-slate-900">
  <!-- max-w-5xl limits line length; mx-auto centers; px-4 adds side padding. -->
  <main class="mx-auto max-w-5xl px-4 py-12">
    <header class="mb-8">
      <h1 class="text-3xl font-bold sm:text-4xl">Tailwind Utility Reading</h1>
      <p class="mt-2 text-slate-600">Each class has one small styling responsibility.</p>
    </header>
    <!-- GRID WHY: 1 column on phones, 2 at md, 3 at lg; gap-5 sets spacing. -->
    <section class="grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-3" aria-label="Examples">
      <!-- rounded-xl shapes corners; border separates cards; p-6 creates inner space. -->
      <article class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="text-xl font-semibold">Spacing</h2><p class="mt-3">Try p-4 or p-8.</p>
      </article>
      <article class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="text-xl font-semibold">Color</h2><p class="mt-3 text-blue-700">Try text-emerald-700.</p>
      </article>
      <article class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="text-xl font-semibold">Responsive</h2><p class="mt-3">Resize the browser window.</p>
      </article>
    </section>
    <!-- HOVER/FOCUS WHY: indicate interaction to mouse and keyboard users. -->
    <a href="#top" class="mt-8 inline-block rounded-lg bg-blue-700 px-5 py-3 font-semibold text-white hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-4">Go to top</a>
  </main>
</body>
</html>
