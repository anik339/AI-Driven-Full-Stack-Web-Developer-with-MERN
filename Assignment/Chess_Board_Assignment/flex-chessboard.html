<!DOCTYPE html>
<html>
<head>

<title>Flex Chess Board</title>

<style>

body{
    text-align:center;
}


.board{

    width:640px;
    height:640px;

    margin:auto;

    display:flex;
    flex-wrap:wrap;

}



.box{

    width:80px;
    height:80px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:45px;

}



.white{

    background:#fff2c2;

}


.black{

    background:#9b4500;

}


</style>

</head>


<body>


<h2>Chess Board Using Flexbox</h2>


<div class="board">


<!-- Black Back Row -->

<div class="box white">♜</div>
<div class="box black">♞</div>
<div class="box white">♝</div>
<div class="box black">♛</div>
<div class="box white">♚</div>
<div class="box black">♝</div>
<div class="box white">♞</div>
<div class="box black">♜</div>


<!-- Black Pawn -->

<div class="box black">♟</div>
<div class="box white">♟</div>
<div class="box black">♟</div>
<div class="box white">♟</div>
<div class="box black">♟</div>
<div class="box white">♟</div>
<div class="box black">♟</div>
<div class="box white">♟</div>



<!-- Empty Rows -->

<div class="box white"></div>
<div class="box black"></div>
<div class="box white"></div>
<div class="box black"></div>
<div class="box white"></div>
<div class="box black"></div>
<div class="box white"></div>
<div class="box black"></div>


<div class="box black"></div>
<div class="box white"></div>
<div class="box black"></div>
<div class="box white"></div>
<div class="box black"></div>
<div class="box white"></div>
<div class="box black"></div>
<div class="box white"></div>


<div class="box white"></div>
<div class="box black"></div>
<div class="box white"></div>
<div class="box black"></div>
<div class="box white"></div>
<div class="box black"></div>
<div class="box white"></div>
<div class="box black"></div>


<div class="box black"></div>
<div class="box white"></div>
<div class="box black"></div>
<div class="box white"></div>
<div class="box black"></div>
<div class="box white"></div>
<div class="box black"></div>
<div class="box white"></div>



<!-- White Pawn -->

<div class="box white">♙</div>
<div class="box black">♙</div>
<div class="box white">♙</div>
<div class="box black">♙</div>
<div class="box white">♙</div>
<div class="box black">♙</div>
<div class="box white">♙</div>
<div class="box black">♙</div>



<!-- White Back Row -->

<div class="box black">♖</div>
<div class="box white">♘</div>
<div class="box black">♗</div>
<div class="box white">♕</div>
<div class="box black">♔</div>
<div class="box white">♗</div>
<div class="box black">♘</div>
<div class="box white">♖</div>


</div>


</body>
</html>
